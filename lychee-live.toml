# Lychee configuration for the POST-DEPLOY live check (.github/workflows/links_live.yml).
# Unlike lychee.toml (pre-deploy), this does NOT exclude www.confium.org — the whole
# point is verifying that production URLs, including canonical/OG ones, resolve.

max_concurrency = 16
timeout = 30
retry_wait_time = 3
max_retries = 3

# Pages exist but rate-limit automated checkers (HN, git.gnupg.org, …)
accept = ["200", "204", "429"]

exclude = [
  # Red Hat sites bot-block link checkers with 403 even for valid pages.
  '^https://access\.redhat\.com/',
  '^https://docs\.redhat\.com/',
  # Cirrus CI blocks non-browser TLS clients.
  '^https://cirrus-ci\.com/',
  # npmjs blocks anonymous head requests with 403 (packages exist).
  '^https://www\.npmjs\.com/',
  # openpgp.org key search returns 404 for keys not yet uploaded.
  '^https://keys\.openpgp\.org/',
]

# Be gentle with GitHub Pages — full-concurrency crawls get throttled (503).
[hosts."www.confium.org"]
concurrency = 4
request_interval = "500ms"
