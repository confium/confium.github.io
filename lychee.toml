# Lychee link-checker configuration — used by `npm run check:links:external`
# locally and by .github/workflows/links.yml in CI.

max_concurrency = 64
timeout = 30
retry_wait_time = 2
max_retries = 2

# Pages exist but rate-limit automated checkers (HN, git.gnupg.org, …)
accept = ["200", "204", "429"]

exclude = [
  # Our own production URLs: canonical/OG URLs resolve only after deploy;
  # internal structure is covered by --root-dir.
  '^https://www\.confium\.org/',
  # Red Hat sites bot-block link checkers with 403 even for valid pages.
  '^https://access\.redhat\.com/',
  '^https://docs\.redhat\.com/',
  # Cirrus CI blocks non-browser TLS clients.
  '^https://cirrus-ci\.com/',
  # sigstore.dev (Netlify) intermittently refuses runner connections
  # ("connection failed" from CI while browsers and local runs get
  # 301 -> 200). Verified working 2026-08-27.
  '^https://sigstore\.dev/',
  '^https://www\.sigstore\.dev/',
  # npmjs blocks anonymous head requests.
  '^https://www\.npmjs\.com/',
  # openpgp.org key search returns 404 for keys not yet uploaded.
  '^https://keys\.openpgp\.org/',
  # NLnet project page returns 404 from the link checker — the canonical
  # NLnet landing page is the right target.
  '^https://nlnet\.nl/project/',
]
