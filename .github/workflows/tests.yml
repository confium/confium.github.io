name: tests

on:
  push:
    branches:
    - main
  pull_request:

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Run Vitest
      run: npm test
      env:
        CI: true

  type_check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Install astro check
      run: npm install --no-save @astrojs/check typescript

    - name: Type check
      run: npx astro check
      env:
        CI: true
