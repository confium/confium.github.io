name: Build and deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skip queued builds on new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        if: github.event_name == 'push'
        id: pages
        uses: actions/configure-pages@v5

      - name: Fetch vendor sources
        run: npm run fetch-sources

      - name: Build site
        run: npm run build

      - name: Quality gate — no OIML references
        run: |
          if grep -ril OIML dist/; then
            echo "ERROR: OIML references found in built site"
            grep -ril OIML dist/
            exit 1
          fi

      - name: Quality gate — no TODO / roadmap language
        run: |
          if grep -rEi 'TODO|coming soon|planned|milestone|roadmap' dist/ \
              --include='*.html' --include='*.md' --include='*.mdx'; then
            echo "ERROR: forbidden language found in built site"
            exit 1
          fi

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
